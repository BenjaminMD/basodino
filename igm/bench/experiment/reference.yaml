# @package _global_
# Benchmark, reference solver: identity mapping (velocity field solved directly,
# L-BFGS, 50 iterations every step), as igm-examples aletsch iceflow_reference.
defaults:
  - override /inputs: [local]
  - override /processes: [smb, iceflow, time, thk]
  - override /outputs: [local]

inputs:
  local:
    filename: synth_dx20.nc
processes:
  smb:
    method: simple
    simple:
      update_freq: 1.0          # mass balance recomputed once per year
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [2000, 0.009, 0.005, 2950, 2.0]
        - [2100, 0.009, 0.005, 3150, 2.0]
  time:
    start: 2000.0
    end: 2100.0
    save: 10.0
  iceflow:
    method: unified
    numerics:
      Nz: 4
      vert_spacing: 4.0
      basis_vertical: Lagrange
    unified:
      mapping: identity
      optimizer: lbfgs
      nbit: 50
      nbit_init: 50
      retrain_freq: 1
      line_search: hager-zhang
outputs:
  local:
    vars_to_save: [thk, velsurf_mag]
