# @package _global_
# Benchmark, offline emulator: frozen DahuNet (dahunet_mini.keras), no retraining.
# Trained for 50-250 m grids; at 10-20 m it extrapolates (cost test only).
defaults:
  - override /inputs: [local]
  - override /processes: [smb, iceflow, time, thk]
  - override /outputs: [local]

inputs:
  local:
    filename: synth_dx20.nc
processes:
  smb:
    method: simple
    simple:
      update_freq: 1.0          # mass balance recomputed once per year
      array:
        - ["time", "gradabl", "gradacc", "ela", "accmax"]
        - [2000, 0.009, 0.005, 2950, 2.0]
        - [2100, 0.009, 0.005, 3150, 2.0]
  time:
    start: 2000.0
    end: 2100.0
    save: 10.0
  iceflow:
    method: unified
    numerics:
      Nz: 2
      basis_horizontal: q1
      basis_vertical: molho
    unified:
      mapping: network
      inputs: [thk, usurf, arrhenius, tau_ref, dX]
      nbit_init: 0
      nbit: 0
      retrain_freq: 0
      network:
        pretrained: true
        pretrained_path: dahunet_mini.keras
outputs:
  local:
    vars_to_save: [thk, velsurf_mag]
